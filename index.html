<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Kalolsavam Poster Studio | Kannur Sub-District & State Winner Poster Maker</title>

  <!-- Google Fonts: Anek Malayalam (with wdth 75..125 for Condensed), Noto Serif Malayalam, Cinzel, Plus Jakarta Sans, Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wdth,wght@75..125,400..800&family=Cinzel:wght@600;700;800;900&family=Noto+Serif+Malayalam:wght@400;600;700;800;900&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Locally compiled Tailwind CSS -->
  <link rel="stylesheet" href="./styles.css">

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>


  <style>
    /* Base & Liquid Glass Styling */
    body {
      background: radial-gradient(circle at 15% 15%, #0e1a38 0%, #060b18 50%, #03060c 100%);
      color: #E2E8F0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', 'Anek Malayalam', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Anek Malayalam Condensed helper */
    .font-anek-condensed {
      font-family: 'Anek Malayalam', sans-serif;
      font-stretch: 75%;
      font-variation-settings: "wdth" 75;
    }

    .font-noto-malayalam {
      font-family: 'Noto Serif Malayalam', serif;
    }

    /* Ambient Glowing Orbs */
    .ambient-orb {
      position: fixed;
      border-radius: 9999px;
      pointer-events: none;
      filter: blur(120px);
      z-index: 0;
      opacity: 0.26;
    }

    /* Liquid Glass Panels */
    .liquid-panel {
      background: rgba(13, 22, 45, 0.68);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.6),
                  inset 0 1px 1px 0 rgba(255, 255, 255, 0.18),
                  inset 0 -1px 1px 0 rgba(0, 0, 0, 0.3);
    }

    .liquid-card {
      background: rgba(18, 30, 60, 0.48);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.35),
                  inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Input Glass Styling */
    .glass-input {
      background: rgba(8, 14, 30, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #F8FAFC;
      transition: all 0.2s ease;
    }
    .glass-input:focus {
      background: rgba(12, 22, 48, 0.9);
      border-color: rgba(0, 242, 254, 0.65);
      box-shadow: 0 0 0 3px rgba(0, 242, 254, 0.15);
      outline: none;
    }
    .glass-input:focus:not(#input-item-name)::placeholder {
      color: transparent;
    }

    .section-number-mobile {
      display: none;
    }

    @media (max-width: 1023px) {
      body.mobile-preview-expanded {
        overflow: hidden;
      }

      body.mobile-preview-expanded main {
        position: relative;
        z-index: 60;
      }

      .section-number-desktop {
        display: none;
      }

      .section-number-mobile {
        display: inline;
      }

      #panel-editor-controls {
        display: contents;
      }

      #panel-poster-preview {
        display: block;
        position: fixed;
        z-index: 45;
        top: calc(50% + (env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) / 2);
        right: 8px;
        transform: translateY(-50%);
        width: 84px;
        padding: 4px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 14px;
        background: rgba(13, 22, 45, 0.82);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.48);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      #preview-status-bar,
      #poster-info-card,
      #poster-preview-container > div:last-child {
        display: none;
      }

      #poster-preview-container {
        display: block;
        padding: 0;
        overflow: visible;
        background: transparent;
        border: 0;
        box-shadow: none;
      }

      #poster-canvas-wrapper {
        width: 100%;
        max-width: none;
        border-radius: 9px;
        cursor: zoom-in;
      }

      #poster-canvas-wrapper > div {
        display: none;
      }

      #panel-poster-preview.mobile-preview-expanded {
        inset: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom));
        z-index: 60;
        display: flex;
        width: auto;
        padding: 10px;
        flex-direction: column;
        gap: 10px;
        overflow: hidden;
        border-radius: 22px;
        background: rgba(4, 7, 17, 0.96);
      }

      #panel-poster-preview.mobile-preview-expanded #preview-status-bar {
        display: flex;
        flex: 0 0 auto;
        flex-direction: column;
        align-items: stretch;
      }

      #panel-poster-preview.mobile-preview-expanded #preview-status-bar > div:last-child {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr) minmax(0, 1fr);
        width: 100%;
        margin-left: 0;
        gap: 8px;
      }

      #panel-poster-preview.mobile-preview-expanded #preview-status-bar select {
        box-sizing: border-box;
        width: 100%;
        min-width: 0;
        max-width: 100%;
        border-radius: 12px;
      }

      #panel-poster-preview.mobile-preview-expanded #poster-preview-container {
        display: flex;
        flex: 1 1 auto;
        min-height: 0;
        padding: 8px;
        overflow: auto;
        background: rgba(13, 22, 45, 0.68);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      #panel-poster-preview.mobile-preview-expanded #poster-canvas-wrapper {
        width: auto;
        max-width: min(100%, 480px);
        max-height: calc(100dvh - 230px);
        margin: auto;
        cursor: default;
      }

      #panel-poster-preview.mobile-preview-expanded #poster-canvas {
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: calc(100dvh - 250px);
        object-fit: contain;
      }

      #panel-poster-preview.mobile-preview-expanded #poster-preview-container > div:last-child {
        display: flex;
        flex: 0 0 auto;
        margin-top: 8px;
      }

      #btn-mobile-preview-close {
        display: inline-flex;
      }

      #panel-photo-settings {
        order: 1;
        grid-column: 1 / -1;
      }

      #poster-info-card {
        display: none;
      }
    }

    /* Custom Range Slider */
    input[type=range] {
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.1);
      height: 6px;
      border-radius: 999px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #FFFFFF;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.8), 0 2px 4px rgba(0,0,0,0.4);
      cursor: pointer;
      border: 2px solid #00F2FE;
      transition: transform 0.1s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    /* Active Pills */
    .pill-active-gold {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.35) 0%, rgba(217, 119, 6, 0.2) 100%) !important;
      border-color: rgba(245, 158, 11, 0.85) !important;
      color: #FEF08A !important;
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.4) !important;
    }
    .pill-active-cyan {
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.3) 0%, rgba(14, 165, 233, 0.15) 100%) !important;
      border-color: rgba(0, 242, 254, 0.75) !important;
      color: #A5F3FC !important;
      box-shadow: 0 0 16px rgba(0, 242, 254, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.4) !important;
    }

    /* Language Switcher Active Pill */
    .lang-btn-active {
      background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%) !important;
      color: #040711 !important;
      font-weight: 800 !important;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4) !important;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(8, 14, 30, 0.3);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    /* Mobile usability refinements: keep the editor comfortable on touch screens. */
    @media (max-width: 1023px) {
      html {
        scroll-padding-top: 104px;
      }

      body {
        padding-bottom: calc(6.5rem + env(safe-area-inset-bottom, 0px));
      }

      #panel-editor-controls > .liquid-panel,
      #panel-photo-settings {
        scroll-margin-top: 104px;
        min-width: 0;
      }

      #panel-editor-controls .glass-input,
      #panel-editor-controls select,
      #panel-editor-controls input:not([type="checkbox"]):not([type="range"]) {
        box-sizing: border-box;
        min-height: 44px;
        font-size: 16px;
      }

      #panel-editor-controls button,
      #mobile-bottom-action-bar button {
        min-height: 44px;
        touch-action: manipulation;
      }

      #panel-editor-controls input[type="range"] {
        min-height: 28px;
        height: 28px;
        touch-action: pan-y;
      }

      #panel-editor-controls input[type="range"]::-webkit-slider-thumb {
        width: 24px;
        height: 24px;
      }

      #panel-editor-controls input[type="range"]::-moz-range-thumb {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 2px solid #00F2FE;
        background: #FFFFFF;
      }

      #panel-poster-preview {
        max-height: calc(100dvh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      }

      #mobile-bottom-action-bar {
        padding-bottom: calc(0.625rem + env(safe-area-inset-bottom, 0px));
      }

      #toast {
        bottom: calc(5.5rem + env(safe-area-inset-bottom, 0px));
      }

      #poster-canvas-wrapper {
        touch-action: manipulation;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid rgba(0, 242, 254, 0.9);
        outline-offset: 2px;
      }
    }

    /* Give tablets a more useful floating preview without changing desktop. */
    @media (min-width: 768px) and (max-width: 1023px) {
      #panel-poster-preview {
        width: 112px;
        right: max(12px, env(safe-area-inset-right, 0px));
      }
    }

    /* Keep the floating preview compact on phones so it obscures less of the form. */
    @media (max-width: 767px) {
      #panel-poster-preview {
        width: 74px;
        right: max(6px, env(safe-area-inset-right, 0px));
        padding: 3px;
        border-radius: 12px;
      }

      #poster-canvas-wrapper {
        border-radius: 7px;
      }

      #mobile-bottom-action-bar {
        gap: 8px;
        padding-left: max(12px, env(safe-area-inset-left, 0px));
        padding-right: max(12px, env(safe-area-inset-right, 0px));
      }

      #mobile-bottom-lang-toggle {
        max-width: 44%;
        min-width: 0;
      }

      #mobile-bottom-lang-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    }

    @media (max-width: 360px) {
      #panel-poster-preview {
        width: 66px;
        right: 5px;
      }

      #mobile-bottom-lang-toggle {
        max-width: 40%;
        padding-left: 9px;
        padding-right: 9px;
      }
    }

  
    /* The right-hand editor is the Function Pill: a single, calm control surface. */
    @media (min-width: 768px) {
      #panel-editor-controls {
        padding: clamp(.75rem, 1.5vw, 1.25rem);
        border: 1px solid rgba(125, 162, 206, .22);
        border-radius: 2rem;
        background: linear-gradient(145deg, rgba(125, 162, 206, .09), rgba(8, 14, 30, .82) 48%, rgba(17, 28, 59, .56));
        box-shadow: 0 24px 56px -32px rgba(0, 0, 0, .85), inset 0 1px rgba(255,255,255,.06);
      }
    }

    /* Reworked split workstation: poster preview on the left, controls on the right. */
    @media (min-width: 768px) {
      .studio-layout #panel-poster-preview { order: 1 !important; }
      .studio-layout #panel-editor-controls { order: 2 !important; }
      #panel-photo-settings {
        border-radius: 2.5rem;
        border-color: rgba(16, 185, 129, 0.28);
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.07), rgba(13, 22, 45, 0.72) 48%);
      }
    }

    /* At tablet widths, restore the preview to the document flow instead of
       using the compact phone floating-preview treatment. */
    @media (min-width: 768px) and (max-width: 1023px) {
      .studio-layout { display: grid !important; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1rem; }
      #panel-editor-controls { display: flex !important; flex-direction: column; gap: 1.25rem; min-width: 0; }
      #panel-poster-preview {
        position: relative !important; inset: auto !important; top: auto !important; right: auto !important;
        transform: none !important; width: auto !important; padding: 0 !important; border: 0 !important;
        border-radius: 0 !important; background: transparent !important; box-shadow: none !important;
        backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
        display: flex !important; flex-direction: column; gap: 1rem; min-width: 0;
      }
      #preview-status-bar, #poster-info-card, #poster-preview-container > div:last-child { display: flex !important; }
      #poster-preview-container {
        display: flex !important; padding: 1rem !important; overflow: hidden !important;
        background: rgba(13, 22, 45, 0.68) !important; border: 1px solid rgba(255,255,255,.12) !important;
        box-shadow: 0 24px 48px -12px rgba(0,0,0,.6) !important;
      }
      #poster-canvas-wrapper {
        width: 100% !important; max-width: 480px !important; border-radius: 1rem !important;
        overflow: hidden !important; cursor: zoom-in;
      }
      #poster-canvas-wrapper > div { display: flex !important; }
    }

    /* Function pill slow subtle float (only the editor controls surface) */
    @media (min-width: 768px) {
      #panel-editor-controls.animate-float {
        animation: float 6.5s ease-in-out infinite;
      }
    }
    @media (max-width: 767px) {
      #panel-editor-controls.animate-float {
        animation: none;
      }
    }
    /* Keep the animated motion subtle and respect reduced-motion preferences. */
    @media (prefers-reduced-motion: reduce) {
      .animate-float { animation: none !important; }
    }
</style>
</head>

<body class="relative selection:bg-cyan-500/30 selection:text-cyan-200 pb-24 lg:pb-12">

  <!-- Ambient Light Orbs -->
  <div class="ambient-orb w-[500px] sm:w-[650px] h-[500px] sm:h-[650px] bg-cyan-600/30 -top-40 -left-20"></div>
